[project]
name = "aoe-linear-plugin"
description = "Linear integration plugin for Agent of Empires"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27"]

[project.scripts]
aoe-linear-worker = "aoe_linear_plugin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aoe_linear_plugin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aoe_linear_plugin"]

[dependency-groups]
dev = ["mypy>=1.14.1", "pytest>=8.3.4", "ruff>=0.11.4"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
show_column_numbers = true
warn_unused_ignores = false
show_error_codes = true
warn_redundant_casts = true
local_partial_types = true
explicit_package_bases = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "ANN401", "TC001", "TC002", "TC003", "EM101", "EM102", "TRY003", "TRY300", "PLR2004", "COM812", "ISC001", "CPY001", "S603", "S607", "PYI034"]
fixable = ["ALL"]
unfixable = ["E702"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "ANN", "INP001", "D", "PLR2004", "FBT002", "ARG001", "ARG002", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers"]
